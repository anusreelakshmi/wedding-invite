<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f5ef">
<title>Abijith & Megha | Wedding Reception</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf8f4;--green:#536d58;--deep:#405846;--gold:#b68b4c;--muted:#7c806f;--line:#c49a5d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--green);font-family:'Montserrat',sans-serif}
.hero{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:35px 18px;background:radial-gradient(ellipse at 50% 48%,#fffdfa 0%,#faf8f4 70%)}
.invitation{position:relative;width:min(100%,760px);min-height:940px;padding:90px 42px 75px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.top-copy{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(19px,3vw,27px);letter-spacing:.055em;line-height:1.45;max-width:600px;color:var(--green)}
.top-copy span{display:block;font-weight:400;font-size:.94em;letter-spacing:.075em}
.names{font-family:'Allura',cursive;font-weight:400;font-size:clamp(76px,13vw,116px);line-height:1.02;color:var(--green);margin:64px 0 0}
.and{font-family:'Cormorant Garamond',serif;font-size:clamp(25px,4vw,36px);letter-spacing:.34em;margin:16px 0 4px 10px;color:var(--green)}
.names.second{margin:0}
.month{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(22px,3vw,27px);letter-spacing:.34em;color:#76552f;margin:54px 0 22px 10px}
.date-row{width:min(100%,590px);display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:18px;color:#76552f}
.date-side{border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:19px 4px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(17px,2.8vw,25px);letter-spacing:.2em;white-space:nowrap}
.day-number{font-family:'Allura',cursive;font-size:clamp(82px,12vw,108px);line-height:.9;color:var(--green)}
.year{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:.38em;color:#76552f;margin:35px 0 58px 10px}
.venue{font-family:'Cormorant Garamond',serif;font-size:clamp(25px,4vw,36px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin:0}
.address{font-family:'Cormorant Garamond',serif;font-size:clamp(19px,3vw,25px);font-weight:600;letter-spacing:.22em;margin-top:3px}
.floral{position:absolute;width:min(31vw,280px);height:auto;opacity:.92;pointer-events:none}
.floral.tl{top:-5px;left:-18px;transform:rotate(0deg)}
.floral.tr{top:-12px;right:-18px;transform:scaleX(-1) rotate(-4deg)}
.floral.bl{bottom:-18px;left:-20px;transform:rotate(180deg)}
.floral.br{bottom:-12px;right:-15px;transform:scaleX(-1) rotate(180deg)}
.more{padding:66px 20px 76px;text-align:center;background:#f2eee6}
.kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#9b7950;font-weight:600}
h2{font:500 clamp(36px,6vw,48px)/1.1 'Cormorant Garamond',serif;margin:14px 0;color:var(--green)}
.more p{font:italic 21px/1.55 'Cormorant Garamond',serif;color:#72786d;max-width:620px;margin:0 auto}
.countdown{display:flex;justify-content:center;gap:12px;margin:30px auto}
.count{min-width:85px;padding:14px 10px;border:1px solid #d9c9ae;background:#fbf9f5}
.count strong{display:block;font:500 35px 'Cormorant Garamond',serif;color:var(--green)}
.count span{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#858475}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{padding:13px 22px;border:1px solid var(--green);color:var(--green);text-decoration:none;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.btn.primary{background:var(--green);color:white}
footer{text-align:center;padding:30px 15px;font:italic 20px 'Cormorant Garamond',serif;color:var(--green)}
@media(max-width:600px){
 .invitation{min-height:790px;padding:92px 12px 60px}
 .top-copy{max-width:350px}
 .names{margin-top:68px}
 .month{margin-top:48px}
 .date-row{grid-template-columns:1fr 78px 1fr;gap:8px}
 .date-side{font-size:15px;letter-spacing:.12em;padding:15px 1px}
 .year{margin:28px 0 48px 8px}
 .floral{width:37vw;max-width:190px}
 .countdown{gap:6px}
 .count{min-width:0;flex:1;padding:12px 4px}
 .count strong{font-size:29px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.hero{min-height:0;padding:32px 20px;background:#f3f0e9}.invite-art{display:block;width:min(100%,650px);height:auto;box-shadow:0 8px 40px #40584612}.more{background:#faf8f4;padding:48px 20px}.count{border:0;background:transparent}.btn{border-radius:30px;letter-spacing:.08em}.more h2{font-size:clamp(30px,5vw,42px)}@media(max-width:600px){.hero{padding:0}.invite-art{width:100%;box-shadow:none}.more{padding:40px 18px}}
</style>
<style>
[hidden]{display:none!important}.cover{min-height:100svh;display:grid;place-items:center;padding:100px 24px;position:relative;overflow:hidden;background:#f8f5f0;text-align:center}.corner{position:absolute;width:clamp(110px,28vw,250px);mix-blend-mode:multiply;pointer-events:none}.c0{top:0;left:0}.c1{top:0;right:0}.c2{bottom:0;left:0}.c3{bottom:0;right:0}.cover-content{position:relative;z-index:1;max-width:580px}.cover h1{font:400 clamp(60px,11vw,100px)/.95 Allura,cursive;margin:28px 0;color:#536d58}.cover h1 span{display:block;font:500 24px Cormorant Garamond,serif;letter-spacing:.25em;margin:16px 0}.cover-date{font:600 20px Cormorant Garamond,serif;letter-spacing:.16em;color:#76552f}.open-btn{cursor:pointer;margin-top:24px;border:1px solid #536d58;background:#536d58;color:white;padding:15px 25px;border-radius:2px;font:500 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase}.cover-rule{width:65px;height:1px;background:#b68b4c;margin:24px auto}.revealed{animation:reveal .65s ease both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.revealed{animation:none}}
</style></head>
